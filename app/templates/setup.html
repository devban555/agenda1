<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações | Painel Pro</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f1a;
      --card: rgba(30, 41, 59, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(2, 6, 23, 0.5);
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
      color: var(--text);
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 26, 0.8);
      backdrop-filter: blur(12px);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }

    .card-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .card-description {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      margin-top: -10px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
      margin-bottom: 0;
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .option input {
      display: none;
    }

    .option:has(input:checked) {
      background: rgba(59, 130, 246, 0.12);
      border-color: var(--primary);
      color: var(--primary);
    }

    .horarios-wrapper {
      background: rgba(2, 6, 23, 0.2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .horarios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .horario-item {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 8px;
      transition: all 0.2s;
    }

    .horario-item:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    .horario-item input[type="time"] {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      outline: none;
      padding: 6px 0;
    }

    .horario-item input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
      opacity: 0.6;
      transition: 0.2s;
    }

    .horario-item input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    .btn-remove-hora {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 13px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-remove-hora:hover {
      color: var(--danger);
    }

    .btn-add-hora {
      background: rgba(59, 130, 246, 0.05);
      border: 1px dashed rgba(59, 130, 246, 0.3);
      color: var(--primary);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-add-hora:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border: 1px solid var(--border);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      margin-top: 30px;
      transition: 0.2s;
    }

    .btn-voltar:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      .options {
        grid-template-columns: repeat(3, 1fr);
      }

      .horarios-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1><i class="fas fa-sliders"></i> Painel de Configurações</h1>
</header>

<div class="container">

  <div class="card">
    <div class="card-header">
      <i class="fas fa-paint-brush"></i>
      <h2>Identidade Visual</h2>
    </div>

    <label><i class="fas fa-store"></i> Nome fantasia</label>
    <input id="nomeFantasia" class="field" placeholder="Ex: Minha Barbearia">

    <label><i class="fas fa-font"></i> Estilo da tipografia</label>
    <select id="fonteTitulo" class="field">
      <option value="padrao">Padrão (Sistema)</option>
      <option value="poppins">Elegante (Poppins)</option>
      <option value="montserrat">Moderna (Montserrat)</option>
      <option value="playfair">Clássica (Playfair)</option>
    </select>

    <button id="salvarIdentidade" class="btn btn-secondary">
      <i class="fas fa-save"></i> Atualizar Identidade
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <i class="fas fa-calendar-week"></i>
      <h2>Dias de Funcionamento</h2>
    </div>

    <div class="options" id="diasSemana">
      <label class="option"><input type="checkbox" value="0"> Seg</label>
      <label class="option"><input type="checkbox" value="1"> Ter</label>
      <label class="option"><input type="checkbox" value="2"> Qua</label>
      <label class="option"><input type="checkbox" value="3"> Qui</label>
      <label class="option"><input type="checkbox" value="4"> Sex</label>
      <label class="option"><input type="checkbox" value="5"> Sáb</label>
      <label class="option"><input type="checkbox" value="6"> Dom</label>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <i class="fas fa-clock"></i>
      <h2>Horários de Funcionamento</h2>
    </div>

    <p class="card-description">
      Gerencie os horários de atendimento clínico/comercial para os dias úteis e finais de semana.
    </p>

    <label style="color: #fff; font-size: 14px; margin-bottom: 12px;">
      <i class="fas fa-calendar-days"></i> Segunda a Sexta
    </label>

    <div class="horarios-wrapper">
      <div class="horarios-grid" id="gridSemana"></div>

      <button type="button" class="btn-add-hora" onclick="addHorarioInput('gridSemana')">
        <i class="fas fa-plus"></i> Adicionar Horário
      </button>
    </div>

    <label style="color: #fff; font-size: 14px; margin-bottom: 12px;">
      <i class="fas fa-calendar-day"></i> Sábado
    </label>

    <div class="horarios-wrapper">
      <div class="horarios-grid" id="gridSabado"></div>

      <button type="button" class="btn-add-hora" onclick="addHorarioInput('gridSabado')">
        <i class="fas fa-plus"></i> Adicionar Horário
      </button>
    </div>

    <button id="salvarBase" class="btn btn-primary" style="margin-top: 10px;">
      <i class="fas fa-check-circle"></i> Salvar Configurações
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <i class="fas fa-calendar-day"></i>
      <h2>Exceções por Data</h2>
    </div>

    <label>Configurar dia específico (Feriados ou Folgas)</label>
    <input type="date" id="dataSelecionada" class="field">

    <div id="agenda"></div>

    <button id="salvarExcecao" class="btn btn-secondary">
      <i class="fas fa-calendar-plus"></i> Aplicar a esta data
    </button>
  </div>

  <a href="/painel" class="btn-voltar">
    <i class="fas fa-arrow-left"></i> Voltar ao painel administrativo
  </a>

</div>

<script>
  /* =========================================================
     CONFIGURAÇÃO PADRÃO
     Usada apenas se ainda não existir configuração salva no backend.
  ========================================================= */

  const horariosPadraoSemana = [
    "09:40", "10:20", "11:00", "13:00", "13:40", "14:20",
    "15:00", "15:40", "16:20", "17:40", "19:00"
  ];

  const horariosPadraoSabado = [
    "11:00", "11:40", "12:20", "13:00", "13:40", "14:20", "15:00"
  ];

  const diasPadrao = [0, 1, 2, 3, 4, 5];


  /* =========================================================
     FUNÇÕES DE HORÁRIOS
  ========================================================= */

  function createHorarioItemHTML(valor = "") {
    const item = document.createElement("div");
    item.className = "horario-item";

    item.innerHTML = `
      <input type="time" value="${valor}">
      <button type="button" class="btn-remove-hora" onclick="this.parentElement.remove()" title="Remover">
        <i class="fas fa-times"></i>
      </button>
    `;

    return item;
  }

  function addHorarioInput(gridId, valor = "") {
    const grid = document.getElementById(gridId);
    grid.appendChild(createHorarioItemHTML(valor));
  }

  function limparGrid(gridId) {
    document.getElementById(gridId).innerHTML = "";
  }

  function renderHorarios(semana = [], sabado = []) {
    limparGrid("gridSemana");
    limparGrid("gridSabado");

    const listaSemana = Array.isArray(semana) && semana.length ? semana : horariosPadraoSemana;
    const listaSabado = Array.isArray(sabado) && sabado.length ? sabado : horariosPadraoSabado;

    listaSemana.forEach(h => addHorarioInput("gridSemana", h));
    listaSabado.forEach(h => addHorarioInput("gridSabado", h));
  }

  function aplicarDiasSelecionados(dias = []) {
    const listaDias = Array.isArray(dias) && dias.length ? dias : diasPadrao;

    document.querySelectorAll("#diasSemana input").forEach(cb => {
      cb.checked = listaDias.includes(parseInt(cb.value));
    });
  }

  function coletarHorarios(gridId) {
    return [...document.querySelectorAll(`#${gridId} input[type="time"]`)]
      .map(i => i.value)
      .filter(Boolean)
      .sort();
  }


  /* =========================================================
     CARREGAR ÚLTIMA CONFIGURAÇÃO SALVA
     IMPORTANTE:
     Essa rota precisa existir no Flask:
     GET /configuracao_base
  ========================================================= */

  async function carregarConfiguracaoBase() {
    try {
      const resposta = await fetch("/configuracao_base", {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!resposta.ok) {
        throw new Error("Rota /configuracao_base não respondeu corretamente.");
      }

      const data = await resposta.json();

      aplicarDiasSelecionados(data.dias_semana || []);

      renderHorarios(
        data.horarios_base?.semana || [],
        data.horarios_base?.sabado || []
      );

    } catch (err) {
      console.warn("Usando configuração padrão porque não foi possível carregar a configuração salva:", err);

      aplicarDiasSelecionados(diasPadrao);
      renderHorarios(horariosPadraoSemana, horariosPadraoSabado);
    }
  }


  /* =========================================================
     IDENTIDADE VISUAL
  ========================================================= */

  const inputNome = document.getElementById("nomeFantasia");
  const selectFonte = document.getElementById("fonteTitulo");
  const btnIdentidade = document.getElementById("salvarIdentidade");

  btnIdentidade.addEventListener("click", () => {
    const nome = inputNome.value.trim();

    if (!nome) {
      alert("Informe o nome fantasia");
      return;
    }

    fetch("/salvar_identidade", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome_fantasia: nome,
        fonte_titulo: selectFonte.value,
        tema: "principal"
      })
    })
    .then(r => r.json())
    .then(() => {
      alert("Identidade salva com sucesso!");
    })
    .catch(err => {
      console.error("Erro:", err);
      alert("Erro ao salvar identidade visual.");
    });
  });


  /* =========================================================
     SALVAR CONFIGURAÇÃO BASE
  ========================================================= */

  document.getElementById("salvarBase").addEventListener("click", () => {
    const dias = [...document.querySelectorAll("#diasSemana input:checked")]
      .map(cb => parseInt(cb.value));

    const horariosSemana = coletarHorarios("gridSemana");
    const horariosSabado = coletarHorarios("gridSabado");

    if (!dias.length) {
      alert("Selecione ao menos um dia de funcionamento.");
      return;
    }

    if (!horariosSemana.length && !horariosSabado.length) {
      alert("Adicione ao menos um horário de funcionamento.");
      return;
    }

    fetch("/salvar_configuracao_base", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        dias_semana: dias,
        horarios_base: {
          semana: horariosSemana,
          sabado: horariosSabado
        }
      })
    })
    .then(r => {
      if (!r.ok) {
        throw new Error("Erro ao salvar configuração.");
      }

      return r.json();
    })
    .then(() => {
      /*
        FIX VISUAL:
        Após salvar, a tela passa a mostrar exatamente o que foi enviado.
        Assim o usuário não fica com a impressão de que voltou ao horário antigo.
      */
      aplicarDiasSelecionados(dias);
      renderHorarios(horariosSemana, horariosSabado);

      alert("Configuração padrão salva!");
    })
    .catch(err => {
      console.error("Erro:", err);
      alert("Erro ao salvar configuração padrão.");
    });
  });


  /* =========================================================
     EXCEÇÕES POR DATA
  ========================================================= */

  document.getElementById("salvarExcecao").addEventListener("click", () => {
    const data = document.getElementById("dataSelecionada").value;

    if (!data) {
      alert("Selecione uma data primeiro.");
      return;
    }

    alert("Funcionalidade de exceção para " + data + " acionada.");
  });


  /* =========================================================
     INICIALIZAÇÃO
  ========================================================= */

  carregarConfiguracaoBase();
</script>

</body>
</html>
