{% extends "base_public.html" %}

{% block title %}Agendamento | Reserve seu Horário{% endblock %}
{% block body_class %}public-body legacy-schedule-page{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/agendar.css') }}">
{% endblock %}

{% block body %}
<main class="legacy-schedule-wrapper">
  <section class="legacy-schedule-card" aria-labelledby="legacyScheduleTitle">
    <h1 id="legacyScheduleTitle">Reserve seu Horário</h1>

    <form method="POST">
      <div class="legacy-schedule-field">
        <i class="fa-regular fa-user" aria-hidden="true"></i>
        <input type="text" name="nome" placeholder="Seu nome completo" aria-label="Nome completo" required>
      </div>

      <div class="legacy-schedule-field">
        <i class="fa-solid fa-phone" aria-hidden="true"></i>
        <input
          type="text"
          name="telefone"
          id="telefone"
          placeholder="Somente 9 dígitos"
          aria-label="Telefone com nove dígitos"
          pattern="[0-9]{9}"
          maxlength="9"
          inputmode="numeric"
          required
        >
      </div>

      <div class="legacy-schedule-field">
        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
        <input type="date" name="data" id="data" aria-label="Data" required>
      </div>

      <div class="legacy-schedule-field">
        <i class="fa-regular fa-clock" aria-hidden="true"></i>
        <input type="time" name="hora" aria-label="Horário" required>
      </div>

      <button type="submit" class="legacy-schedule-submit">
        Confirmar Agendamento
      </button>
    </form>
  </section>
</main>
{% endblock %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/pages/agendar.js') }}" defer></script>
{% endblock %}
