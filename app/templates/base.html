<!DOCTYPE html>
<html
  lang="{% block lang %}pt-BR{% endblock %}"
  class="{% block html_class %}{% endblock %}"
  data-theme="{{ tema_atual|default(usuario.tema if usuario is defined and usuario else session.get('tema', 'principal'), true) }}"
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>{% block title %}Agenda1{% endblock %}</title>

  {% block meta_extra %}{% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  {% block font_stylesheets %}
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% endblock %}

  {% block icon_stylesheet %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
