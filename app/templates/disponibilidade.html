<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disponibilidade</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0f1a;
    --card:rgba(30,41,59,.4);
    --border:rgba(255,255,255,.08);
    --primary:#3b82f6;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
}

h1{
    margin-top:0;
    margin-bottom:25px;
    text-align:center;
}

label{
    display:block;
    margin-bottom:10px;
    color:var(--muted);
    font-weight:600;
}

input[type="date"]{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#111827;
    color:white;
    margin-bottom:25px;
}

.horarios{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
}

.horario{
    border:1px solid var(--border);
    background:#111827;
    border-radius:16px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.horario:hover{
    transform:translateY(-2px);
}

.horario.disponivel{
    border-color:#1d4ed8;
}

.horario.bloqueado{
    background:rgba(239,68,68,.15);
    border-color:var(--danger);
}

.hora{
    font-size:18px;
    font-weight:700;
}

.status{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
}

.actions{
    margin-top:30px;
    display:flex;
    gap:12px;
}

.btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
    font-weight:700;
}

.btn-salvar{
    background:var(--primary);
    color:white;
}

.btn-voltar{
    background:#1f2937;
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>
            <i class="fa-solid fa-calendar-check"></i>
            Disponibilidade
        </h1>

        <label>Selecione a data</label>

        <input type="date" id="data">

        <div id="horarios" class="horarios"></div>

        <div class="actions">

            <button class="btn btn-salvar" id="salvar">
                Salvar Disponibilidade
            </button>

            <a href="/painel" class="btn btn-voltar">
                Voltar
            </a>

        </div>

    </div>

</div>

<script>

const dataInput =
    document.getElementById('data');

const btnSalvar =
    document.getElementById('salvar');

const horariosContainer =
    document.getElementById('horarios');

let horariosAtuais = [];
let horariosBloqueados = [];

function renderizarHorarios(){

    horariosContainer.innerHTML = '';

    horariosAtuais.forEach(h => {

        const bloqueado =
            horariosBloqueados.includes(h);

        const div =
            document.createElement('div');

        div.className =
            bloqueado
                ? 'horario bloqueado'
                : 'horario disponivel';

        div.dataset.hora = h;

        div.innerHTML = `
            <div class="hora">${h}</div>
            <div class="status">
                ${bloqueado ? 'Bloqueado' : 'Disponível'}
            </div>
        `;

        div.addEventListener('click', () => {

            const hora = div.dataset.hora;

            if(horariosBloqueados.includes(hora)){

                horariosBloqueados =
                    horariosBloqueados.filter(
                        h => h !== hora
                    );

            }else{

                horariosBloqueados.push(hora);

            }

            renderizarHorarios();

        });

        horariosContainer.appendChild(div);

    });

}

async function carregarDisponibilidade(){

    const data = dataInput.value;

    if(!data){
        horariosContainer.innerHTML = '';
        return;
    }

    try{

        const response =
            await fetch(
                '/carregar_disponibilidade',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:data
                    })
                }
            );

        const resultado =
            await response.json();

        horariosAtuais =
            resultado.horarios || [];

        horariosBloqueados =
            resultado.bloqueados || [];

        renderizarHorarios();

    }catch(err){

        console.error(err);

        alert(
            'Erro ao carregar disponibilidade.'
        );

    }

}

async function salvarDisponibilidade(){

    const data = dataInput.value;

    if(!data){

        alert(
            'Selecione uma data.'
        );

        return;

    }

    try{

        const response =
            await fetch(
                '/salvar_disponibilidade',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:data,
                        horarios_bloqueados:
                            horariosBloqueados
                    })
                }
            );

        const resultado =
            await response.json();

        if(resultado.status === 'ok'){

            alert(
                'Disponibilidade salva com sucesso!'
            );

        }else{

            alert(
                'Erro ao salvar.'
            );

        }

    }catch(err){

        console.error(err);

        alert(
            'Erro ao salvar disponibilidade.'
        );

    }

}

dataInput.addEventListener(
    'change',
    carregarDisponibilidade
);

btnSalvar.addEventListener(
    'click',
    salvarDisponibilidade
);

</script>

</body>
</html>
