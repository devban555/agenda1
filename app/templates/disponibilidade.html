{% extends "base_admin.html" %}

{% block title %}Disponibilidade{% endblock %}
{% block body_class %}admin-body disponibilidade-page{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/disponibilidade.css') }}">
{% endblock %}

{% block body %}

<div class="container">

    <div class="card">

        <h1>
            <i class="fa-solid fa-calendar-check"></i>
            Disponibilidade
        </h1>

        <label for="profissional">Profissional</label>
        <select id="profissional" class="disponibilidade-select">
            {% for profissional in profissionais %}
              <option value="{{ profissional.id }}">{{ profissional.nome }}</option>
            {% endfor %}
        </select>

        <label for="data">Selecione a data</label>

        <input type="date" id="data">

        <div id="horarios" class="horarios"></div>

        <div class="actions">

            <button class="btn btn-salvar" id="salvar">
                Salvar Disponibilidade
            </button>

            <a href="/painel" class="btn btn-voltar">
                Voltar
            </a>

        </div>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>

const dataInput =
    document.getElementById('data');

const profissionalInput =
    document.getElementById('profissional');

const btnSalvar =
    document.getElementById('salvar');

const horariosContainer =
    document.getElementById('horarios');

let horariosAtuais = [];
let horariosBloqueados = [];

function renderizarHorarios(){

    horariosContainer.innerHTML = '';

    horariosAtuais.forEach(h => {

        const bloqueado =
            horariosBloqueados.includes(h);

        const div =
            document.createElement('div');

        div.className =
            bloqueado
                ? 'horario bloqueado'
                : 'horario disponivel';

        div.dataset.hora = h;

        div.innerHTML = `
            <div class="hora">${h}</div>
            <div class="status">
                ${bloqueado ? 'Bloqueado' : 'Disponível'}
            </div>
        `;

        div.addEventListener('click', () => {

            const hora = div.dataset.hora;

            if(horariosBloqueados.includes(hora)){

                horariosBloqueados =
                    horariosBloqueados.filter(
                        h => h !== hora
                    );

            }else{

                horariosBloqueados.push(hora);

            }

            renderizarHorarios();

        });

        horariosContainer.appendChild(div);

    });

}

async function carregarDisponibilidade(){

    const data = dataInput.value;

    if(!data){
        horariosContainer.innerHTML = '';
        return;
    }

    try{

        const response =
            await fetch(
                '/carregar_disponibilidade',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:data,
                        profissional_id:profissionalInput.value
                    })
                }
            );

        const resultado =
            await response.json();

        horariosAtuais =
            resultado.horarios || [];

        horariosBloqueados =
            resultado.bloqueados || [];

        renderizarHorarios();

    }catch(err){

        console.error(err);

        alert(
            'Erro ao carregar disponibilidade.'
        );

    }

}

async function salvarDisponibilidade(){

    const data = dataInput.value;

    if(!data){

        alert(
            'Selecione uma data.'
        );

        return;

    }

    try{

        const response =
            await fetch(
                '/salvar_disponibilidade',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        data:data,
                        profissional_id:profissionalInput.value,
                        horarios_bloqueados:
                            horariosBloqueados
                    })
                }
            );

        const resultado =
            await response.json();

        if(resultado.status === 'ok'){

            alert(
                'Disponibilidade salva com sucesso!'
            );

        }else{

            alert(
                'Erro ao salvar.'
            );

        }

    }catch(err){

        console.error(err);

        alert(
            'Erro ao salvar disponibilidade.'
        );

    }

}

dataInput.addEventListener(
    'change',
    carregarDisponibilidade
);

profissionalInput.addEventListener('change', () => {
    horariosAtuais = [];
    horariosBloqueados = [];
    if (dataInput.value) {
        carregarDisponibilidade();
    } else {
        horariosContainer.innerHTML = '';
    }
});

btnSalvar.addEventListener(
    'click',
    salvarDisponibilidade
);

</script>
{% endblock %}
