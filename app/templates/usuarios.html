<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Admin Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0f1a;
            --card: rgba(30, 41, 59, 0.45);
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
            color: var(--text);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h2 { font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px; }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-add:hover { opacity: 0.9; transform: translateY(-2px); }

        .table-wrapper {
            background: var(--card);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px 20px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .table td {
            padding: 16px 20px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }

        .table tr:last-child td { border-bottom: none; }
        .table tr:hover { background: rgba(255, 255, 255, 0.02); }

        .user-info { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 35px;
            height: 35px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge.ativo { background: rgba(34, 197, 94, 0.1); color: var(--green); }
        .badge.inativo { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .actions { display: flex; gap: 8px; }

        .btn-action {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn-action:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .btn-delete:hover { background: var(--red); border-color: var(--red); }

        .slug-text {
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--purple);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header-flex">
        <h2><i class="fa-solid fa-users-gear" style="color: var(--primary); margin-right: 10px;"></i>Usuários</h2>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar por nome ou slug...">
        </div>

        <button class="btn-add"><i class="fa-solid fa-plus"></i> Novo Usuário</button>
    </div>

    <div class="table-wrapper">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuário</th>
                    <th>Slug</th>
                    <th>Status</th>
                    <th style="text-align: right;">Ações</th>
                </tr>
            </thead>

            <tbody>
                {% for user in usuarios %}
                <tr>
                    <td data-label="ID">#{{ user.id }}</td>
                    <td data-label="Usuário">
                        <div class="user-info">
                            <div class="avatar">{{ user.username[:2] | upper }}</div>
                            <span>{{ user.username }}</span>
                        </div>
                    </td>
                    <td data-label="Slug"><span class="slug-text">/{{ user.slug }}</span></td>
                    <td data-label="Status">
                        {% if user.is_active %}
                        <span class="badge ativo">Ativo</span>
                        {% else %}
                        <span class="badge inativo">Inativo</span>
                        {% endif %}
                    </td>
                    <td data-label="Ações">
                        <div class="actions" style="justify-content: flex-end;">

                            <button class="btn-action" title="Plano">
                                <i class="fa-solid fa-layer-group"></i>
                            </button>

                            <button class="btn-action" title="Editar">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>

                            <button class="btn-action" title="Relatório">
                                <i class="fa-solid fa-chart-simple"></i>
                            </button>

                            <button class="btn-action" title="Backup">
                                <i class="fa-solid fa-database"></i>
                            </button>

                            <button class="btn-action btn-delete" title="Desativar">
                                <i class="fa-solid fa-ban"></i>
                            </button>

                        </div>
                    </td>
                </tr>
                {% endfor %}

                {% if not usuarios %}
                <tr>
                    <td colspan="5" style="text-align: center; padding: 40px; color: var(--muted);">
                        Nenhum usuário encontrado.
                    </td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
