<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Setup | Criar MasterADM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f1a;
      --card: rgba(30, 41, 59, 0.45);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: rgba(255, 255, 255, 0.08);
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header { text-align: center; margin-bottom: 32px; }

    .setup-icon {
      width: 60px;
      height: 60px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--success);
      margin: 0 auto 16px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    h2 { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; }
    p.subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .group { position: relative; margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper { position: relative; }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    .input:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
    }

    .btn-create {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
    }

    .btn-create:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      transition: 0.3s;
    }

    .back-link:hover { color: var(--text); }

    /* Estilo para avisos de segurança */
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="security-badge">
        <i class="fa-solid fa-user-shield"></i> Área de Configuração
      </div>
      <div class="setup-icon">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2>Novo MasterADM</h2>
      <p class="subtitle">Defina as credenciais de alta hierarquia</p>
    </div>

    <!-- Mensagens de Erro/Sucesso -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 12px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 20px;">
          {% for msg in messages %} {{ msg }} {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="group">
        <label>Usuário Root</label>
        <div class="input-wrapper">
          <input type="text" name="username" required class="input" placeholder="Ex: admin_master">
          <i class="fa-regular fa-circle-user"></i>
        </div>
      </div>

      <div class="group">
        <label>Senha de Acesso</label>
        <div class="input-wrapper">
          <input type="password" name="password" required class="input" placeholder="••••••••">
          <i class="fa-solid fa-fingerprint"></i>
        </div>
      </div>

      <div class="group" style="margin-bottom: 30px;">
        <label>Chave de Autenticação</label>
        <div class="input-wrapper">
          <input type="password" name="chave" required class="input" placeholder="Token mestre">
          <i class="fa-solid fa-code-branch"></i>
        </div>

      </div>

      <button type="submit" class="btn-create">
        Instalar Administrador
      </button>

      <a href="{{ url_for('auth.login') }}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Voltar para o login
      </a>
    </form>
  </div>
</body>
</html>
